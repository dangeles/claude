name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate config (frontmatter + JSON gates)
        run: ./sync-config.py validate --verbose

      # Bare `pytest` (no path) so bundled skill script tests are collected too --
      # `pytest tests/` silently skipped the 42 tests under
      # claude-config/skills/plotting-advisor/scripts/tests/.
      - name: Run test suite
        run: python -m pytest -v
